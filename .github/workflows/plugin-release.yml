# DEPRECATED, and not verifiable by the official registry. This workflow signs
# with Ed25519 (NOX_SIGNING_KEY); the registry verifies keyless cosign bundles
# produced by GoReleaser. `nox plugin init` no longer generates a reference to
# it -- plugins carry their own release.yml and .goreleaser.yaml (nox
# docs/plugin-authoring.md, "Distribution"). Kept only so plugins scaffolded
# before nox v1.38.3 do not break outright; every run warns.
name: Plugin Release

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.25'
      registry-repo:
        description: 'Registry repository for index update dispatch'
        required: false
        type: string
        default: 'nox-hq/nox-registry'
    secrets:
      NOX_SIGNING_KEY:
        description: 'Ed25519 private key for artifact signing (base64-encoded)'
        required: false
      REGISTRY_DISPATCH_TOKEN:
        description: 'GitHub token with repo dispatch permission on registry repo'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64

    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated shared workflow::nox-hq/.github plugin-release.yml is deprecated. Run 'nox plugin init' (nox >= 1.38.3) in a scratch directory and copy its .github/workflows and .goreleaser.yaml into this repository; see https://github.com/nox-hq/nox/blob/main/docs/plugin-authoring.md#distribution"
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          PLUGIN_NAME=$(basename $(pwd))
          OUTPUT="${PLUGIN_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" -o "${OUTPUT}" .

      - name: Compute SHA-256 digest
        id: digest
        run: |
          PLUGIN_NAME=$(basename $(pwd))
          BINARY="${PLUGIN_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          DIGEST="sha256:$(sha256sum "${BINARY}" | awk '{print $1}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "binary=${BINARY}" >> "$GITHUB_OUTPUT"

      - name: Create tar.gz archive
        run: |
          tar -czf "${{ steps.digest.outputs.binary }}.tar.gz" "${{ steps.digest.outputs.binary }}"

      # `secrets` is not available in an `if:` expression — using it there is a
      # workflow VALIDATION error, so the whole file fails to start and the run
      # reports zero jobs with no log to read. The supported shape is to map the
      # secret into `env` (which does allow the secrets context) and test that,
      # which is what nox-remediate.yml in this repo already does via
      # HAVE_NOX_TOKEN.
      - name: Sign artifact
        if: env.HAVE_SIGNING_KEY == 'true'
        env:
          HAVE_SIGNING_KEY: ${{ secrets.NOX_SIGNING_KEY != '' }}
          NOX_SIGNING_KEY: ${{ secrets.NOX_SIGNING_KEY }}
        run: |
          echo "${NOX_SIGNING_KEY}" | base64 -d > /tmp/signing-key.pem
          # Sign the tar.gz digest with Ed25519
          ARCHIVE="${{ steps.digest.outputs.binary }}.tar.gz"
          ARCHIVE_DIGEST="sha256:$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          echo "${ARCHIVE_DIGEST}" | openssl pkeyutl -sign -inkey /tmp/signing-key.pem -out "${ARCHIVE}.sig"
          rm -f /tmp/signing-key.pem

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.tar.gz.sig

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true

      - name: Generate version entry fragment
        run: |
          PLUGIN_NAME=$(basename $(pwd))
          VERSION="${GITHUB_REF_NAME#v}"
          cat > version-entry.json <<EOF
          {
            "plugin": "${GITHUB_REPOSITORY}",
            "name": "${PLUGIN_NAME}",
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": []
          }
          EOF

      - name: Dispatch registry update
        if: env.HAVE_DISPATCH_TOKEN == 'true'
        env:
          HAVE_DISPATCH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          gh api repos/${{ inputs.registry-repo }}/dispatches \
            -f event_type=plugin-release \
            -f client_payload[version_entry]="$(cat version-entry.json)"
