name: Security badge

# This repository's own badge, from the reusable workflow it hosts. It calls
# the local copy so a change to nox-badge.yml is exercised here first.
on:
  schedule:
    - cron: '57 5 * * 1' # Mondays, staggered across the org's repositories
  workflow_dispatch: {} # nox:ignore IAC-308,IAC-155 -- re-grades on demand; it opens a PR, which is where review happens

permissions:
  contents: write # nox:ignore IAC-314 -- pushes the badge branch
  pull-requests: write

jobs:
  badge:
    uses: ./.github/workflows/nox-badge.yml
    secrets: inherit
