# Reusable Nox Remediate — dependency + GitHub Actions remediation in one place.
#
# Replaces Dependabot's "open a PR with the version bump" loop, and goes past it:
# nox also SHA-pins mutable action refs (@v1, @main), which Dependabot never
# does. One scan, one `nox fix`, one PR.
#
# Ported from klarlabs-studio/.github, where this pattern already runs across
# 20+ repositories. The one addition is the verify step: a remediation PR that
# has not been tested is a PR a reviewer has to test by hand.
#
# Call it from a repo with a thin wrapper:
#
#   on:
#     schedule:
#       - cron: "0 3 * * 1"
#     workflow_dispatch: {}
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     remediate:
#       uses: Nox-HQ/.github/.github/workflows/nox-remediate.yml@main
#       secrets: inherit
#
# Bump nox-version / nox-sha256 here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      nox-version:
        description: "nox release version (no leading v)."
        type: string
        default: "1.21.0"
      nox-sha256:
        description: "sha256 of nox_<version>_linux_amd64.tar.gz (verify on bump)."
        type: string
        default: "3cebe42ff3c7b2ef462ee500737be87b93833ee166c171f3751075f81e53861f"
      include-major:
        description: "Allow major-version bumps (off by default; majors are surfaced but held)."
        type: boolean
        default: false
      content-fixes:
        description: >-
          Also rewrite mechanically-fixable IaC misconfigurations in place
          (privileged: true -> false, runAsNonRoot: false -> true, and 12 more
          such rules). Off by default: unlike a version bump, this edits
          infrastructure that is already deployed and running, and "insecure"
          is sometimes load-bearing — a privileged container may be a CNI
          plugin that stops working the moment the flag flips. Opt in per repo,
          once you know a failing verify-cmd will catch it.
        type: boolean
        default: false
      outdated-fixes:
        description: >-
          Also upgrade dependencies that are merely out of date, not just those
          with a vulnerability. `nox fix` on its own acts only on VULN-001
          findings, so an outdated-but-not-vulnerable package is never touched;
          this is the pass that keeps the fleet current. As of nox 1.21.0 it
          covers Go, npm, PyPI, Cargo, RubyGems, Composer and NuGet. ON by default because
          it replaces Dependabot's version updates, which ran on every repo:
          defaulting it off would leave a repo with no currency updates at all
          and nothing reporting that fact. A bump that breaks the build is
          caught by verify-cmd before any PR is opened.
        type: boolean
        default: true
      verify-cmd:
        description: "Command run after applying upgrades. Empty skips verification."
        type: string
        default: "go test ./... -count=1"
    secrets:
      # nox:ignore IAC-351 -- declares a secret INPUT; the value is never in this file
      NOX_TOKEN:
        description: >-
          PAT with contents + pull-requests + workflows write. Required to push
          remediation of .github/workflows/* — the default GITHUB_TOKEN cannot,
          and GitHub does not expose that scope through the `permissions:` block.
          Falls back to GITHUB_TOKEN, which still covers dependency-only
          remediation.
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nox-remediate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Action-pin remediation edits files under .github/workflows, which
          # GitHub refuses to accept from the default GITHUB_TOKEN:
          #
          #   ! [remote rejected] refusing to allow a GitHub App to create or
          #     update workflow `.github/workflows/ci.yml` without `workflows`
          #     permission
          #
          # Dependabot is privileged to do this; a self-hosted workflow is not.
          # NOX_TOKEN carries the scope; without it the run still remediates
          # dependencies and simply leaves action pins alone.
          token: ${{ secrets.NOX_TOKEN || github.token }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      - name: Install nox (pinned + sha256-verified)
        env:
          NOX_VERSION: ${{ inputs.nox-version }}
          NOX_SHA256: ${{ inputs.nox-sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o nox.tgz
          echo "${NOX_SHA256}  nox.tgz" | sha256sum -c -
          sudo tar xzf nox.tgz -C /usr/local/bin nox
          rm nox.tgz

      - name: Scan and remediate
        env:
          # `nox fix --actions` resolves each action's latest release through the
          # GitHub API — 60 requests/hour unauthenticated, which a real workflow
          # directory exhausts.
          GITHUB_TOKEN: ${{ secrets.NOX_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_MAJOR: ${{ inputs.include-major }}
          CONTENT_FIXES: ${{ inputs.content-fixes }}
          OUTDATED_FIXES: ${{ inputs.outdated-fixes }}
          HAVE_NOX_TOKEN: ${{ secrets.NOX_TOKEN != '' }}
        run: |
          # Scan output goes to RUNNER_TEMP, never the working tree.
          #
          # `-output .` writes findings.json, ai.inventory.json and friends into
          # the repository root. The commit below stages tracked modifications,
          # so once any of those files has been committed even once it is
          # refreshed and re-committed by every subsequent run. That is already
          # happening upstream: findings.json rides along in nomi and dispatch
          # remediation PRs, ai.inventory.json in senat-os — all auto-merged.
          # Writing outside the tree makes it impossible rather than tidying up
          # afterwards, which only ever covers the filenames someone remembered.
          out="${RUNNER_TEMP}/nox-scan"
          mkdir -p "$out"
          # A scan that finds something exits non-zero; that is the normal case
          # here and is not an error.
          nox scan . -format json -output "$out" || true
          major=""
          [ "$INCLUDE_MAJOR" = "true" ] && major="--include-major"

          # Only attempt action-pin remediation when a token that can PUSH it
          # exists. Running --actions without NOX_TOKEN rewrites files under
          # .github/workflows and the push is then rejected outright:
          #
          #   ! [remote rejected] refusing to allow a GitHub App to create or
          #     update workflow `.github/workflows/ci.yml` without `workflows`
          #     permission
          #
          # so the whole run fails and the dependency upgrades it did find are
          # thrown away with it. Skipping the pass keeps that half working, and
          # says so rather than quietly narrowing what was scanned.
          actions=""
          if [ "$HAVE_NOX_TOKEN" = "true" ]; then
            actions="--actions"
          else
            echo "nox: NOX_TOKEN not set — remediating dependencies only." >&2
            echo "nox: GitHub Action pins are left untouched; GITHUB_TOKEN cannot push workflow file changes." >&2
          fi
          nox fix $actions $major --input "$out/findings.json" --root . || true

          # The IaC content pass is a SECOND invocation, not another flag on the
          # line above. `--content` short-circuits inside nox fix: the content
          # code path returns before the dependency and action passes run, so
          # `nox fix --actions --content` silently does content only and drops
          # the upgrades the previous line would have made. Two commands is not
          # redundancy here, it is the only ordering that produces both.
          #
          # Deliberately NOT gated on HAVE_NOX_TOKEN. The action-pin gate exists
          # because --actions writes under .github/workflows and GITHUB_TOKEN is
          # refused when pushing those; --content only touches Kubernetes,
          # Terraform, Docker and Compose files, which the default token pushes
          # fine. Gating it would disable IaC remediation on every repo that has
          # no PAT, for a permission it never needs.
          #
          # --write, because bare --content only prints the diff and exits 0 —
          # the run would then reach the PR step with an empty working tree and
          # report "nothing to remediate" while the misconfiguration stays live.
          # Reuses the same findings.json: a re-scan would be a second full pass
          # over the tree for input nox already has on disk.
          #
          # `|| true` for the same reason as the line above: a failure in the
          # content pass must not throw away the dependency upgrades already
          # applied to the working tree. Verify and the PR step both handle an
          # unchanged tree, so the worst case is a smaller PR, not a lost run.
          if [ "$CONTENT_FIXES" = "true" ]; then
            nox fix --content --write --input "$out/findings.json" --root . || true
          fi

          # THIRD invocation, for the same reason --content is a second one:
          # --outdated short-circuits inside nox fix exactly as --content does,
          # returning before the dependency and Action passes. Adding it to
          # either line above would silently do the currency pass ONLY and drop
          # the upgrades that line was there to make.
          #
          # This is the currency pass, and it is a different question from
          # everything above it: `nox fix` acts on VULN-001 findings, so it
          # moves a dependency only when there is a vulnerability. A package
          # that is merely old is never touched, which is why every plugin repo
          # sat on nox v1.17.0 while this workflow ran green each week.
          #
          # Takes no findings.json: it is not acting on a finding. Needs the
          # network to ask what is newer, which is why nox keeps it behind an
          # explicit flag and out of `scan`.
          if [ "$OUTDATED_FIXES" = "true" ]; then
            nox fix --outdated $major --root . || true
          fi

          [ -f go.mod ] && go mod tidy || true

      - name: Verify
        # Runs before the PR is opened so reviewers never receive an untested
        # upgrade. A failure here fails the run and opens nothing, which is the
        # intended outcome: the upgrade broke something and a human should see
        # the logs rather than a green PR.
        if: inputs.verify-cmd != ''
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "nox: nothing changed; skipping verification."
            exit 0
          fi
          ${{ inputs.verify-cmd }}

      - name: Open remediation PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.NOX_TOKEN || github.token }}
          CONTENT_FIXES: ${{ inputs.content-fixes }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "nox: nothing to remediate."
            exit 0
          fi
          # A PR that says "deps + actions" while also rewriting a securityContext
          # gets reviewed as a version bump — skimmed, approved. Name the IaC pass
          # in the title and body whenever it ran, so the diff a reviewer expects
          # is the diff they get.
          scope="deps + actions"
          content_note=""
          if [ "$CONTENT_FIXES" = "true" ]; then
            scope="deps + actions + IaC"
            content_note=" Also includes deterministic IaC content fixes (\`nox fix --content --write\`): mechanical misconfiguration rewrites such as \`privileged: true\` -> \`false\`. These edit infrastructure that may already be deployed — review them as config changes, not as dependency bumps."
          fi
          branch="nox/remediate-${{ github.run_id }}"
          git config user.name "nox-remediate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(security): nox remediation ($scope)"
          git push -u origin "$branch"
          # `gh pr create --label` hard-fails when the label is absent, opening
          # no PR at all. --force is idempotent: creates or updates, never errors.
          gh label create dependencies \
            --color 0366d6 \
            --description "Pull requests that update a dependency file" \
            --force >/dev/null 2>&1 || true
          url="$(gh pr create \
            --title "chore(security): nox remediation ($scope)" \
            --body "Automated remediation by \`nox fix --actions\`: OSV-vulnerable dependency upgrades, plus outdated and mutable GitHub Actions pins rewritten to their SHA-pinned latest release.${content_note} Verified with \`${{ inputs.verify-cmd }}\` before opening." \
            --label dependencies)"

          # Land it. Without this the workflow opened a PR and stopped, and
          # nothing downstream ever merged one: on 2026-08-02 all 15 open
          # remediation PRs across the Nox-HQ plugin repos had been sitting
          # unmerged, the oldest since 27 July. Security remediation was being
          # generated faithfully every week and then abandoned.
          #
          # Auto-merge first, which is the right mechanism where the repo has
          # required checks to wait on. Nox-HQ plugin repos currently have no
          # branch protection, so GitHub rejects --auto there — for those, wait
          # for the PR's own checks and merge only if they pass. The content was
          # already verified with `${{ inputs.verify-cmd }}` before the PR was
          # opened; this is the second, independent confirmation, and skipping
          # it to "just merge" would make this workflow the one path into main
          # that no CI ever gated.
          if gh pr merge --auto --squash "$url" 2>/dev/null; then
            echo "nox: auto-merge enabled; will land once required checks pass."
            exit 0
          fi

          echo "nox: no required checks for auto-merge to wait on; watching this PR's checks instead."
          if gh pr checks "$url" --watch --fail-fast --interval 20 >/dev/null 2>&1; then
            gh pr merge --squash --delete-branch "$url" \
              && echo "nox: remediation merged." \
              || echo "::warning::Checks passed but the merge was refused. Needs a manual merge: ${url}"
          else
            echo "::warning::Remediation PR opened but its checks did not pass, so it was not merged. It needs a look: ${url}"
          fi
