# Reusable nox security badge: scan the repository with a pinned nox, render
# its grade to .github/nox-badge.svg, and land the change as a PR.
#
# The badge is the grade nox gives the default branch, so it is regenerated
# from main, not from a pull request, and it is committed rather than served:
# a README image that points at a third-party badge service is a request to
# that service from every reader.
#
# Call it from a repo with a thin wrapper, and reference the SVG from the
# README as <img src=".github/nox-badge.svg" alt="nox security grade">:
#
#   on:
#     schedule:
#       - cron: "41 5 * * 1"
#     release:
#       types: [published]
#     workflow_dispatch: {}
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     badge:
#       uses: Nox-HQ/.github/.github/workflows/nox-badge.yml@main
#       secrets: inherit
#
# Bump nox-version / nox-sha256 here once; every caller picks it up.
on:
  workflow_call:
    inputs:
      nox-version:
        description: "nox release version (no leading v)."
        type: string
        default: "1.68.0"
      nox-sha256:
        description: "sha256 of nox_<version>_linux_amd64.tar.gz (verify on bump)."
        type: string
        default: "ee5e6bbc9cf493f7ea76bc65a28e1c83407f054ba8a6cfdfcca52d498201ddc7"
    secrets:
      # nox:ignore IAC-351 -- declares a secret INPUT; the value is never in this file
      NOX_TOKEN:
        description: >-
          PAT with contents + pull-requests write. GitHub starts no workflow run
          for a PR opened with the default GITHUB_TOKEN, so such a PR reports
          no checks and a repository with required checks can never merge it.
          Falls back to GITHUB_TOKEN, which still works where nothing is
          required.
        required: false

permissions:
  contents: write # nox:ignore IAC-314 -- pushes the badge branch
  pull-requests: write

concurrency:
  group: nox-badge-${{ github.repository }}
  cancel-in-progress: true # nox:ignore IAC-309 -- only the newest scan's grade is meaningful

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.NOX_TOKEN || github.token }}

      - name: Install nox (pinned + sha256-verified)
        env:
          NOX_VERSION: ${{ inputs.nox-version }}
          NOX_SHA256: ${{ inputs.nox-sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/nox.tgz"
          echo "${NOX_SHA256}  ${RUNNER_TEMP}/nox.tgz" | sha256sum -c -
          sudo tar xzf "${RUNNER_TEMP}/nox.tgz" -C /usr/local/bin nox

      - name: Scan and render the badge
        run: |
          set -euo pipefail
          # Scan output goes to RUNNER_TEMP, never the working tree: a report
          # written into the repository is scanned by the next run.
          out="${RUNNER_TEMP}/nox-scan"
          vex=()
          [ -f vex.json ] && vex=(--vex vex.json)
          # A scan that finds something exits non-zero; that is the normal case.
          nox scan . --format json --output "$out" --quiet "${vex[@]}" || true
          test -s "$out/findings.json"
          mkdir -p .github
          nox badge --input "$out/findings.json" --output .github/nox-badge.svg

      - name: Open and land the badge PR if the grade changed
        env:
          GH_TOKEN: ${{ secrets.NOX_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/nox-badge.svg && [ -z "$(git status --porcelain -- .github/nox-badge.svg)" ]; then
            echo "nox: badge unchanged."
            exit 0
          fi
          branch="nox/badge-${{ github.run_id }}"
          git config user.name "nox-badge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .github/nox-badge.svg
          git commit -m "ci: refresh nox security badge"
          git push -u origin "$branch"
          url="$(gh pr create \
            --title "ci: refresh nox security badge" \
            --body "Regenerated \`.github/nox-badge.svg\` from a scan of the default branch with nox ${{ inputs.nox-version }}. Generated by Nox-HQ/.github's nox-badge workflow.")"

          # Auto-merge where there are required checks to wait on; otherwise
          # wait for this PR's own checks and merge only if they pass.
          if gh pr merge --auto --squash "$url" 2>/dev/null; then
            echo "nox: auto-merge enabled; will land once required checks pass."
            exit 0
          fi
          if gh pr checks "$url" --watch --fail-fast --interval 20 >/dev/null 2>&1; then
            gh pr merge --squash --delete-branch "$url"
          elif [ -z "$(gh pr checks "$url" 2>/dev/null)" ]; then
            # No checks at all (a PR opened with GITHUB_TOKEN starts none): the
            # change is one generated SVG, so merging it is not an ungated path
            # for code.
            gh pr merge --squash --delete-branch "$url"
          else
            echo "::warning::Badge PR checks did not pass, so it was not merged: ${url}"
          fi
