# DEPRECATED. `nox plugin init` no longer generates a reference to this
# workflow; plugins now carry their own ci.yml (see nox docs/plugin-authoring.md,
# "Distribution"). It is kept working for plugins scaffolded before nox v1.38.3,
# and every run says so. One fix keeps it usable meanwhile: golangci-lint is now
# built with a Go new enough to load a Go 1.26 module (v2.7.2 was built with
# 1.25 and failed nox-plugin-freshness's lint from its first commit).
name: Plugin CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version to use'
        required: false
        type: string
        default: '1.25'
      nox-version:
        description: 'Nox SDK version constraint'
        required: false
        type: string
        default: 'latest'
      run-conformance:
        description: 'Run conformance tests'
        required: false
        type: boolean
        default: true
    secrets:
      NOX_SIGNING_KEY:
        description: 'Ed25519 private key for artifact signing (base64)'
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecation notice
        run: echo "::warning title=Deprecated shared workflow::nox-hq/.github plugin-ci.yml is deprecated. Run 'nox plugin init' (nox >= 1.38.3) in a scratch directory and copy its .github/workflows and .goreleaser.yaml into this repository; see https://github.com/nox-hq/nox/blob/main/docs/plugin-authoring.md#distribution"
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  conformance:
    if: ${{ inputs.run-conformance }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run conformance tests
        run: go test -run TestConformance -v ./...

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goos: linux
            goarch: amd64
          - os: linux
            arch: arm64
            goos: linux
            goarch: arm64
          - os: darwin
            arch: amd64
            goos: darwin
            goarch: amd64
          - os: darwin
            arch: arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          PLUGIN_NAME=$(basename $(pwd))
          OUTPUT="${PLUGIN_NAME}-${{ matrix.os }}-${{ matrix.arch }}"
          go build -trimpath -ldflags="-s -w" -o "${OUTPUT}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *-${{ matrix.os }}-${{ matrix.arch }}
